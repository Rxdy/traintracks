# Vérifie chaque push et chaque demande de fusion : types puis tests, côté front et côté serveur.
name: Tests

on:
  push:
    branches: ["**"] # pas les tags : un tag de version passe par release.yml, qui rappelle ces tests
  pull_request:
  workflow_call:

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # le même build que l'image Docker du front : attrape les erreurs que les tests ne voient pas
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
