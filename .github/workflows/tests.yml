# Vérifie chaque push et chaque demande de fusion : types puis tests, côté front et côté serveur.
name: Tests

on:
  push:
    branches-ignore: [dev, staging, main] # dev : images.yml rappelle ces tests avant le build ; staging et main ne font que promouvoir
  pull_request:
  workflow_call:

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # le même build que l'image Docker du front : attrape les erreurs que les tests ne voient pas
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
