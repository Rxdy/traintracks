# Publie les images Docker (front et API) quand on pousse un tag de version : git tag v1.2.0 && git push origin v1.2.0
# Les pushs et fusions ordinaires ne produisent PAS d'image (ils ne lancent que les tests) : seul un tag « vX.Y.Z » compte.
# Le Pi récupère ensuite l'image « latest » (Watchtower) ; pour figer une version, mettre TAG=v1.2.0 dans son .env.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  images:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: front
            dockerfile: front/Dockerfile
          - service: api
            dockerfile: server/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Le Pi est en arm64 : l'étape « npm ci » de l'image API s'exécute dans l'architecture cible, d'où QEMU.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom d'image (en minuscules)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/traintracks-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
