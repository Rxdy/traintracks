server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : renvoie index.html pour toutes les routes inconnues
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
