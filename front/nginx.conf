server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API : transmise au serveur (conteneur « api »)
    location /api/ {
        # nom unique : « api » tout court est aussi le nom d'autres API sur le réseau partagé de Traefik (le Pi en a plusieurs)
        proxy_pass http://traintracks-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : renvoie index.html pour toutes les routes inconnues
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker et manifeste : toujours revalidés (sinon les mises à jour
    # n'arrivent jamais chez les joueurs)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Cache long pour les assets versionnés
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
