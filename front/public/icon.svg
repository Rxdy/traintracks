<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc38a"/>
      <stop offset="1" stop-color="#2a9564"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- décor : arbres -->
  <g fill="#1f7a4f" opacity="0.55">
    <circle cx="400" cy="120" r="34"/><circle cx="440" cy="170" r="24"/>
    <circle cx="110" cy="400" r="30"/><circle cx="160" cy="448" r="20"/>
  </g>
  <!-- tout le tracé reste dans la zone sûre centrale (icône « maskable ») -->
  <g fill="none">
    <!-- ballast -->
    <path d="M-20 150 H200 A90 90 0 0 1 290 240 V532" stroke="#e7d9b0" stroke-width="104" stroke-linejoin="round"/>
    <!-- traverses -->
    <path d="M-20 150 H200 A90 90 0 0 1 290 240 V532" stroke="#7a4e2d" stroke-width="76" stroke-dasharray="11 17"/>
    <!-- rails -->
    <g stroke-linecap="butt">
      <path d="M-20 128 H200 A112 112 0 0 1 312 240 V532" stroke="#334155" stroke-width="15"/>
      <path d="M-20 172 H200 A68 68 0 0 1 268 240 V532" stroke="#334155" stroke-width="15"/>
      <path d="M-20 128 H200 A112 112 0 0 1 312 240 V532" stroke="#e2e8f0" stroke-width="8"/>
      <path d="M-20 172 H200 A68 68 0 0 1 268 240 V532" stroke="#e2e8f0" stroke-width="8"/>
    </g>
  </g>
  <!-- locomotive vue de dessus, roulant vers le bas -->
  <g transform="translate(290 0)">
    <ellipse cx="4" cy="368" rx="40" ry="62" fill="#000" opacity="0.18"/>
    <rect x="-31" y="302" width="62" height="124" rx="16" fill="url(#b)" stroke="#7f1d1d" stroke-width="5"/>
    <rect x="-31" y="302" width="62" height="42" rx="14" fill="#991b1b"/>
    <rect x="-18" y="312" width="36" height="14" rx="4" fill="#fecaca" opacity="0.85"/>
    <circle cx="0" cy="378" r="11" fill="#1f2937"/>
    <circle cx="0" cy="378" r="5" fill="#6b7280"/>
    <circle cx="0" cy="424" r="8" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  </g>
</svg>
